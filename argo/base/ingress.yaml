apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: argo
  name: argo-server
  annotations:
    ingress.kubernetes.io/proxy-body-size: 100M
    nginx.ingress.kubernetes.io/backend-protocol: https # ingress-nginx
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    cert-manager.io/cluster-issuer: iurimihai-dev
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - argo.iurimihai.dev
    secretName: iurimihai-dev-tls
  rules:
    - http:
        paths:
          - backend:
              service:
                name: argo-server
                port:
                  number: 2746
            path: /
            pathType: Prefix
      host: argo.iurimihai.dev
