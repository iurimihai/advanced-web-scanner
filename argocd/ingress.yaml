apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: argocd
  name: argocd-server
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS # ingress-nginx
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/issuer: argocd
    # cert-manager.io/cluster-issuer: iurimihai-dev
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - argocd.iurimihai.dev
    secretName: argocd-tls
  rules:
    - http:
        paths:
          - backend:
              service:
                name: argocd-server
                port:
                  number: 443
            path: /
            pathType: Prefix
      host: argocd.iurimihai.dev
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: argocd
  namespace: argocd
spec:
  acme:
    # The ACME server URL
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # Email address used for ACME registration
    email: iurimihai.meresan@gmail.com
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: argocd-tls
    # Enable the HTTP-01 challenge provider
    solvers:
    - dns01:
        cloudflare:
          email: iurimihai.meresan@gmail.com
          apiTokenSecretRef:
            name: cloudflare-access
            key: api-key
